<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="iris" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#EAD3AC"/>
      <stop offset="55%" stop-color="#C4A484"/>
      <stop offset="100%" stop-color="#9E7F63"/>
    </radialGradient>
    <linearGradient id="goldline" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D8B98F"/>
      <stop offset="50%" stop-color="#C4A484"/>
      <stop offset="100%" stop-color="#A8876A"/>
    </linearGradient>
  </defs>

  <!-- Background: near-black roundel -->
  <rect x="2" y="2" width="508" height="508" rx="254" fill="#0A0A0A"/>
  <rect x="5" y="5" width="502" height="502" rx="251" fill="none" stroke="#C4A484" stroke-width="2.5" opacity="0.55"/>

  <!-- Almond eye outline (single clean closed path), drawn fully then iris on top -->
  <path d="M 96 256
           C 142 172, 250 138, 344 150
           C 400 157, 428 204, 428 256
           C 428 308, 400 355, 344 362
           C 250 374, 142 340, 96 256 Z"
        fill="none" stroke="url(#goldline)" stroke-width="15" stroke-linejoin="round"/>

  <!-- Iris (drawn after, cleanly inside) -->
  <circle cx="268" cy="256" r="100" fill="url(#iris)"/>

  <!-- Pupil (dark) -->
  <circle cx="272" cy="254" r="46" fill="#0A0A0A"/>

  <!-- Specular highlight -->
  <circle cx="246" cy="224" r="15" fill="#F2E2C6" opacity="0.95"/>
  <circle cx="300" cy="286" r="6" fill="#F2E2C6" opacity="0.5"/>

  <!-- Upper lash / brow arc for a futuristic stern look -->
  <path d="M 150 204 C 206 146, 320 134, 388 188"
        fill="none" stroke="#C4A484" stroke-width="9" opacity="0.85" stroke-linecap="round"/>
</svg>
