server {
    listen 62.84.186.1:80;
    listen [2a02:c207:2319:3150::1]:80;
    server_name godseye.digitalhustlerx.com;
    return 301 https://$host$request_uri;
}

server {
    listen 62.84.186.1:443 ssl http2;
    listen [2a02:c207:2319:3150::1]:443 ssl http2;
    server_name godseye.digitalhustlerx.com;

    ssl_certificate /etc/letsencrypt/live/godseye.digitalhustlerx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/godseye.digitalhustlerx.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    root /root/godseye-repo/dist;
    index index.html;


    # Legacy .md artifact links -> human-readable .html pages (2026-08-08)
    location = /Godseye-Insight-Report.md { return 301 /godseye-insight-report.html; }
    location = /Godseye-Tier-Matrix.md    { return 301 /godseye-tiers.html; }
    location = /Godseye-Case-Study.md     { return 301 /godseye-tiers.html; }

    # Main domain entry = dedicated waitlist landing page (strict capture).
    location = / {
        try_files /waitlist.html /index.html;
    }

    # Full marketing SPA stays reachable under /app (not the main entry).
    location = /app { return 301 /app/; }
    location /app/ {
        alias /root/godseye-repo/dist/;
        try_files $uri $uri/ /app/index.html;
    }

    # Living with Agents community page (static, served from repo)
    location /community/ {
        alias /root/godseye-repo/living-with-agents/;
        try_files $uri $uri/ /community/index.html;
    }

    # Catch-all: serve real files; fall back to a NAMED location so a missing
    # asset cannot re-enter this location and cause an internal-redirect loop.
    location / {
        try_files $uri $uri/ @waitlist;
    }
    location @waitlist {
        return 302 /waitlist.html;
    }

    # Forward ALL /api/* to the Node backend (:3000). Required for plugin
    # download, purchase status, referral, auth, checkout, and WP connect.
    # Previously only /api/waitlist + /api/track were proxied, so every other
    # /api/* route 302'd to /waitlist.html (blocking payment delivery).
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/godseye.digitalhustlerx.com.access.log;
    error_log /var/log/nginx/godseye.digitalhustlerx.com.error.log;
}
